[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "labsuite"
version = "0.1.0"
description = "Desktop and CLI analysis platform for VSM, ESR, and FMR data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Fridge" }
]
keywords = [
  "vsm",
  "esr",
  "fmr",
  "magnetics",
  "spintronics",
  "analysis",
  "gui",
  "lab"
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "lmfit>=1.2",
  "PySide6>=6.7",
  "pyqtgraph>=0.13",
  "typer>=0.12",
  "rich>=13.7",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "ipython>=8.26",
]
build = [
  "pyinstaller>=6.10",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.scripts]
labsuite = "labsuite.cli.main:main"
labsuite-gui = "labsuite.app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labsuite"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = []

[tool.coverage.run]
source = ["src/labsuite"]

[tool.coverage.report]
show_missing = true
skip_empty = true
