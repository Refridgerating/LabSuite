name: fmr-default
signal_channel: fit_source
baseline_enabled: true
baseline_edge_points: 4
smoothing_enabled: false
smoothing_window: 7
smoothing_polyorder: 2
fit_mode: auto
n_peaks: auto
trace_fit_model: mixed_derivative_lorentzian
physics_model: ip_simple
background_model: linear
multi_peak_selection: bic
min_peak_separation_mT: 4.0
min_linewidth_mT: null
max_linewidth_mT: null
enable_branch_tracking: false
plot_component_fits: false
fit_g: false
fit_g_diagnostic: false
compare_locked_vs_floating_g: false
fit_Hk: false
branch_locked_g: {}
branch_locked_gamma_over_2pi_GHz_per_T: {}
branch_locked_Hk_mT: {}
field_polarity: unknown
geometry: unknown
frequency_match_tolerance_GHz: 0.001
allow_low_confidence_pos_neg_matching: false
prefer_pos_neg_matched_average: false
joint_pos_neg_matched_fit: false
fit_field_offset: false
linewidth_min_high_confidence_points: 4
peak_min_prominence_ratio: 0.2
peak_min_distance_mT: 8.0
peak_min_pair_width_mT: 4.0
candidate_window_padding_width_multiplier: 1.5
double_fit_min_improvement_ratio: 0.15
max_resonance_count: 2
field_guard_fraction: 0.05
linewidth_max_sweep_fraction: 0.35
residual_rmse_max_signal_fraction: 0.12
amplitude_snr_min: 5.0
shape_center_tolerance_linewidth_fraction: 0.35
shape_center_tolerance_min_mT: 1.5
shape_pair_prominence_ratio: 0.20
shape_consistency_policy: reject
critical_bound_hit_policy: reject
kittel_min_points: 3
linewidth_min_points: 2
field_polarity_correction:
  enabled: false
  method: gonzalez_fuentes_average
  polarity_column: null
  require_pair: true
  group_by:
    - sample_id
    - replicate_id
    - frequency
    - geometry
    - mode_id
  positive_labels:
    - positive
    - pos
    - plus
    - "+H"
  negative_labels:
    - negative
    - neg
    - minus
    - "-H"
  max_pair_frequency_tolerance_ghz: 0.001
  max_pair_hres_split_mT: null
  on_unpaired: warn_and_keep_raw
  fit_field: Hres_avg
  run_comparison_fits: true
  plot_diagnostics: false
measurement_requirements:
  gonzalez_fuentes_average:
    requires_positive_and_negative_field_sweeps: true
    cannot_be_applied_to_single_polarity_data: true
